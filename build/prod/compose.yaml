services:
  runlet_database:
    hostname: database
    image: postgres:18-alpine
    env_file:
      - .env
    volumes:
      - runlet_postgres_data:/var/lib/postgresql
    networks:
      - runlet_internal
      - runlet_migrations_network

  runlet:
    build:
      context: ../../
      dockerfile: build/prod/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      runlet_database:
        condition: service_started
      runlet_rabbitmq:
        condition: service_healthy
    networks:
      - runlet_internal
    env_file:
      - .env
    environment:
      - AVAILABLE_LANGS_CODES=["py", "go", "cs", "js", "cpp"]
    command: uvicorn runlet.main:app --host 0.0.0.0 --port 8000 --reload


  runlet_mailgeno:
    image: theapplekingy/mailgeno:latest
    env_file:
      - .env
    command: ["-c", "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}", "-r", "mail"]
    networks:
      - runlet_internal
    depends_on:
      runlet_rabbitmq:
        condition: service_healthy


  runlet_rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:management-alpine
    env_file:
      - .env
    volumes:
      - runlet_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - runlet_external
      - runlet_internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  
networks:
  runlet_external:
    external: true
  runlet_migrations_network:
    external: true
  runlet_internal:

volumes:
  runlet_rabbitmq_data:
    name: runlet_rabbitmq_data
  runlet_postgres_data:
    name: runlet_postgres_data